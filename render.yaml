services:
  - type: web
    name: nest-ecommerce
    runtime: node
    buildCommand: npm ci && npm run build
    preDeployCommand: node scripts/migrate.mjs
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: nest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
    disk:
      name: product-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

databases:
  - name: nest-db
    databaseName: nest
    user: nest
